<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Color Palette Generator 🎨</title>
<style>
  /* ---------- Base ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #111318;
    color: #f1f3f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }

  header { text-align: center; margin-bottom: 1.5rem; }
  header h1 { font-size: 1.8rem; margin-bottom: 0.4rem; }
  header p { color: #9aa1ad; font-size: 0.95rem; }
  kbd {
    background: #23262d;
    border: 1px solid #3a3f48;
    border-bottom-width: 3px;
    border-radius: 6px;
    padding: 0.1rem 0.55rem;
    font-family: inherit;
    font-size: 0.85rem;
  }

  /* ---------- Palette row ---------- */
  .palette {
    display: flex;
    width: 100%;
    max-width: 900px;
    gap: 0.75rem;
  }

  .swatch {
    flex: 1;
    min-height: 240px;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 1rem;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    position: relative;
    user-select: none;
  }
  .swatch:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.35); }

  .hex {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .copy-hint { font-size: 0.75rem; opacity: 0.7; }

  /* Lock button sits at the bottom of the swatch */
  .lock-btn {
    align-self: flex-start;
    background: rgba(0, 0, 0, 0.25);
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    padding: 0.35rem 0.55rem;
    cursor: pointer;
    line-height: 1;
    /* Inherit the contrast text color set by JS */
    color: inherit;
  }
  .lock-btn:hover { background: rgba(0, 0, 0, 0.45); }

  /* "Copied!" toast, shown briefly when a HEX is copied */
  .copied {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 0.45rem 1rem;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .copied.show { opacity: 1; }

  /* ---------- Controls ---------- */
  .controls { margin-top: 1.75rem; display: flex; gap: 0.75rem; }
  button.generate {
    background: #4c6ef5;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    padding: 0.8rem 1.75rem;
    cursor: pointer;
  }
  button.generate:hover { background: #3b5bdb; }

  footer { margin-top: 2rem; color: #6b7280; font-size: 0.8rem; }

  /* ---------- Mobile: stack swatches vertically ---------- */
  @media (max-width: 640px) {
    .palette { flex-direction: column; }
    .swatch { min-height: 110px; flex-direction: row; align-items: center; }
    .swatch .lock-btn { align-self: auto; }
  }
</style>
</head>
<body>

<header>
  <h1>Color Palette Generator 🎨</h1>
  <p>Press <kbd>Space</kbd> or hit Generate — click a color to copy it, 🔒 to keep it.</p>
</header>

<!-- The 5 swatches are built by JavaScript so the HTML stays tiny -->
<div class="palette" id="palette"></div>

<div class="controls">
  <button class="generate" id="generateBtn">🎲 Generate</button>
</div>

<footer>Click a swatch to copy its HEX · lock the ones you love · Day 8 of 365 🚀</footer>

<script>
  // ---------- Configuration ----------
  const SWATCH_COUNT = 5;          // how many colors in the palette
  const paletteEl = document.getElementById("palette");
  const generateBtn = document.getElementById("generateBtn");

  // Each entry holds the current color and whether it is locked.
  const colors = [];

  // ---------- Helper: make a random HEX color ----------
  // Math.random() gives 0–1; scale it to 0–16777215 (0xFFFFFF) and
  // convert to base-16 (hex). padStart makes sure it's always 6 digits.
  function randomHex() {
    const n = Math.floor(Math.random() * 0xffffff);
    return "#" + n.toString(16).padStart(6, "0");
  }

  // ---------- Helper: pick a readable text color ----------
  // We estimate brightness (luminance) of the background color.
  // Bright colors get dark text, dark colors get light text.
  function textColorFor(hex) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    // Weighted luminance formula (human eyes see green as brightest)
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.5 ? "#111318" : "#f1f3f5";
  }

  // ---------- Build the swatch elements ----------
  for (let i = 0; i < SWATCH_COUNT; i++) {
    const hex = randomHex();
    colors.push({ hex, locked: false });

    // One swatch = a div with the HEX label, a copy hint,
    // a lock button, and a hidden "Copied!" toast.
    const swatch = document.createElement("div");
    swatch.className = "swatch";
    swatch.dataset.index = i;
    swatch.innerHTML = `
      <div>
        <div class="hex">${hex}</div>
        <div class="copy-hint">click to copy</div>
      </div>
      <div class="copied">Copied! ✅</div>
      <button class="lock-btn" title="Lock this color">🔓</button>
    `;
    paletteEl.appendChild(swatch);
  }

  // ---------- Paint a swatch: background + readable text ----------
  function paintSwatch(index) {
    const swatch = paletteEl.children[index];
    const { hex } = colors[index];
    swatch.style.background = hex;
    swatch.style.color = textColorFor(hex);
    swatch.querySelector(".hex").textContent = hex;
  }

  // Paint all swatches for the first render
  for (let i = 0; i < SWATCH_COUNT; i++) paintSwatch(i);

  // ---------- Generate: re-roll only the unlocked colors ----------
  function generate() {
    for (let i = 0; i < SWATCH_COUNT; i++) {
      if (!colors[i].locked) {
        colors[i].hex = randomHex();
        paintSwatch(i);
      }
    }
  }
  generateBtn.addEventListener("click", generate);

  // ---------- Spacebar also generates (but not while typing) ----------
  document.addEventListener("keydown", (event) => {
    if (event.code === "Space") {
      event.preventDefault(); // stop the page from scrolling
      generate();
    }
  });

  // ---------- One listener for clicks on the whole palette ----------
  // We check *what* was clicked: the lock button, or the swatch itself.
  paletteEl.addEventListener("click", (event) => {
    const swatch = event.target.closest(".swatch");
    if (!swatch) return;
    const index = Number(swatch.dataset.index);

    // 1) Lock button clicked → toggle the lock, stop here
    if (event.target.closest(".lock-btn")) {
      colors[index].locked = !colors[index].locked;
      swatch.querySelector(".lock-btn").textContent =
        colors[index].locked ? "🔒" : "🔓";
      return;
    }

    // 2) Swatch clicked → copy HEX to clipboard, show feedback
    const hex = colors[index].hex;
    navigator.clipboard.writeText(hex).then(() => {
      const toast = swatch.querySelector(".copied");
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 900);
    });
  });
</script>
</body>
</html>
